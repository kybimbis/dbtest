<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Тренажер ОКР: Базы Данных</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131b2e;
      --card-bg: #1c2640;
      --border: #2a3859;
      --primary: #38bdf8;
      --primary-dim: rgba(56, 189, 248, 0.12);
      --correct: #22c55e;
      --correct-bg: rgba(34, 197, 94, 0.15);
      --wrong: #ef4444;
      --wrong-bg: rgba(239, 68, 68, 0.15);
      --text: #f1f5f9;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }
    
    /* Sticky Top Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .top-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .stat-badge {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--subtext);
    }
    .stat-badge span { color: var(--primary); }
    .btn-stats-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: var(--surface);
      margin-top: 8px;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--correct));
      transition: width 0.3s ease;
    }

    /* Layout */
    .container { max-width: 680px; margin: 0 auto; padding: 16px; }
    .header-text { margin-bottom: 20px; text-align: left; }
    .header-text h1 { font-size: 1.35rem; color: #fff; margin-bottom: 4px; }
    .header-text p { font-size: 0.85rem; color: var(--subtext); }

    /* Stats Panel (Drawer / Modal) */
    .stats-drawer {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .stats-drawer.open { display: block; }
    .stats-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      margin-bottom: 14px;
    }
    .metric-box {
      background: var(--card-bg);
      padding: 10px 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .metric-box .num { font-size: 1.1rem; font-weight: 700; }
    .metric-box .lbl { font-size: 0.72rem; color: var(--subtext); margin-top: 2px; }
    .metric-green { color: var(--correct); }
    .metric-red { color: var(--wrong); }
    .metric-blue { color: var(--primary); }

    .matrix-title { font-size: 0.78rem; text-transform: uppercase; color: var(--subtext); margin-bottom: 8px; }
    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
    }
    .matrix-item {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      color: var(--subtext);
    }
    .matrix-item.is-correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
    .matrix-item.is-wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }

    /* Sections & Cards */
    .section-header {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin: 28px 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      scroll-margin-top: 75px;
    }
    .card-title {
      font-size: 0.96rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 14px;
      color: #fff;
    }
    .options { display: flex; flex-direction: column; gap: 8px; }
    .opt-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
      line-height: 1.35;
      transition: background 0.15s, border-color 0.15s;
    }
    .opt-btn:active { background: #1f2b48; }
    .opt-btn.correct { background: var(--correct-bg); border-color: var(--correct); color: #4ade80; font-weight: 600; }
    .opt-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: #f87171; }
    .options.disabled { pointer-events: none; }

    .expl-box {
      margin-top: 12px;
      padding: 12px;
      background: #0f1626;
      border-left: 3px solid var(--primary);
      border-radius: 4px;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #cbd5e1;
      display: none;
    }
    .expl-box.show { display: block; }
    .btn-reset {
      margin: 20px 0;
      width: 100%;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--subtext);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-inner">
      <div class="stat-badge">Пройдено: <span id="hdr-progress">0/50</span> | <span id="hdr-pct">0%</span></div>
      <button class="btn-stats-toggle" id="toggle-stats-btn">Статистика</button>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
  </div>

  <div class="container">
    <div class="header-text">
      <h1>Комплексный тест по БД (ОКР)</h1>
      <p>50 вопросов по архитектуре, SQL, оптимизации, транзакциям и NoSQL</p>
    </div>

    <div class="stats-drawer" id="stats-drawer">
      <div class="stats-summary">
        <div class="metric-box">
          <div class="num metric-blue" id="stat-total">0</div>
          <div class="lbl">Решено</div>
        </div>
        <div class="metric-box">
          <div class="num metric-green" id="stat-correct">0</div>
          <div class="lbl">Верно</div>
        </div>
        <div class="metric-box">
          <div class="num metric-red" id="stat-wrong">0</div>
          <div class="lbl">Ошибок</div>
        </div>
      </div>
      <div class="matrix-title">Навигация по вопросам:</div>
      <div class="matrix-grid" id="matrix-grid"></div>
    </div>

    <div id="questions-root"></div>

    <button class="btn-reset" onclick="resetQuiz()">Сбросить весь прогресс</button>
  </div>

  <script>
    const questions = [
      /* РАЗДЕЛ 1: Проектирование и нормализация */
      {
        s: "Раздел 1. Проектирование БД и нормализация",
        q: "1. На каком этапе проектирования базы данных структура становится зависимой от конкретной СУБД (PostgreSQL, MySQL, MS SQL Server)?",
        o: ["На концептуальном этапе", "На логическом этапе", "На физическом этапе", "Структура никогда не зависит от СУБД"],
        a: 2,
        e: "Концептуальный (ER) и логический этапы абстрактны. Выбор диалекта СУБД, аппаратных структур, типов данных (NVARCHAR, CLOB) и индексов выполняется на физическом этапе."
      },
      {
        s: "Раздел 1. Проектирование БД и нормализация",
        q: "2. В таблице заказов поле phones содержит значение '89161112233, 89254445566'. Какая нормальная форма нарушена?",
        o: ["1НФ", "2НФ", "3НФ", "Таблица не нарушает нормальных форм"],
        a: 0,
        e: "1-я нормальная форма требует неделимости (атомарности) атрибутов в каждой строке."
      },
      {
        s: "Раздел 1. Проектирование БД и нормализация",
        q: "3. В таблице студентов есть поля: id_студента, номер_группы, название_факультета. Зависимость: Студент -> Группа -> Факультет. Какая нормальная форма нарушена?",
        o: ["1НФ, нарушена атомарность", "2НФ, есть неполная функциональная зависимость", "3НФ, присутствует транзитивная зависимость неключевого атрибута от ПК", "3НФ, так как ПК составной"],
        a: 2,
        e: "Факультет зависит от Группы, а Группа — от Студента. Транзитивная зависимость неключевого атрибута от ПК нарушает 3НФ."
      },
      {
        s: "Раздел 1. Проектирование БД и нормализация",
        q: "4. Таблица находится в 1НФ и имеет составной первичный ключ (Курс_ID, Студент_ID). Столбец 'Продолжительность_курса' зависит только от Курс_ID. Какая НФ нарушена?",
        o: ["Нарушена 2НФ", "Нарушена 3НФ", "Нарушена BCNF", "Ничего не нарушено, если нет транзитивности"],
        a: 0,
        e: "2НФ требует отсутствия частичной зависимости неключевых атрибутов от части составного первичного ключа."
      },
      {
        s: "Раздел 1. Проектирование БД и нормализация",
        q: "5. Чем нормальная форма Бойса-Кодда (BCNF) строже третьей нормальной формы (3НФ)?",
        o: ["Она запрещает использовать составные первичные ключи", "В BCNF в любой нетривиальной зависимости X -> Y детерминант X обязан являться суперключом", "BCNF требует разделения всех числовых и строковых полей", "BCNF применяется исключительно в графовых базах данных"],
        a: 1,
        e: "В 3НФ атрибут Y может быть первичным (входить в потенциальный ключ), даже если X — не суперключ. BCNF этого исключения не допускает."
      },
      {
        s: "Раздел 1. Проектирование БД и нормализация",
        q: "6. Что характеризует денормализацию реляционной базы данных?",
        o: ["Исправление ошибок 1НФ", "Осознанное внесение избыточности для ускорения операций чтения (SELECT)", "Удаление всех внешних ключей (FK) из базы", "Переход на хранение всех данных в JSON"],
        a: 1,
        e: "Денормализация уменьшает число JOIN при чтении, жертвуя скоростью вставок, обновления и требуя контроля аномалий."
      },
      {
        s: "Раздел 1. Проектирование БД и нормализация",
        q: "7. Что такое суррогатный ключ (Surrogate Key)?",
        o: ["Ключ, составленный из естественных реквизитов (например, серия и номер паспорта)", "Искусственно созданное уникальное поле (например, автоинкремент ID или UUID), не несущее бизнес-смысла", "Внешний ключ, ссылающийся сам на свою же таблицу", "Ключ, который не проверяется СУБД на уникальность"],
        a: 1,
        e: "Суррогатный ключ автономен от бизнес-логики и защищает архитектуру от смены форматов паспортов, ИНН и названий."
      },

      /* РАЗДЕЛ 2: SQL, фильтрация и соединения */
      {
        s: "Раздел 2. Выполнение SQL-запросов и JOIN",
        q: "8. Каков правильный логический порядок выполнения предложений в SQL-запросе СУБД?",
        o: ["SELECT -> FROM -> WHERE -> GROUP BY -> HAVING -> ORDER BY", "FROM -> WHERE -> GROUP BY -> HAVING -> SELECT -> ORDER BY", "FROM -> GROUP BY -> WHERE -> SELECT -> HAVING -> ORDER BY", "FROM -> SELECT -> WHERE -> GROUP BY -> HAVING -> ORDER BY"],
        a: 1,
        e: "Сначала считываются таблицы (FROM), фильтруются строки (WHERE), группируются (GROUP BY), фильтруются группы (HAVING), формируется проекция (SELECT) и упорядочивается (ORDER BY)."
      },
      {
        s: "Раздел 2. Выполнение SQL-запросов и JOIN",
        q: "9. Чем принципиально отличается условие в WHERE от условия в HAVING?",
        o: ["WHERE фильтрует группы, а HAVING — отдельные строки", "WHERE выполняется до группировки строк, а HAVING — после группировки сформированных групп", "В WHERE можно использовать агрегаты (SUM, AVG), а в HAVING — нет", "Разницы нет, оптимизатор СУБД считает их синонимами"],
        a: 1,
        e: "В WHERE агрегатные функции запрещены (группы еще не сформированы), а HAVING фильтрует уже свернутый набор строк."
      },
      {
        s: "Раздел 2. Выполнение SQL-запросов и JOIN",
        q: "10. Какое соединение вернёт декартово произведение строк (строки таблицы А x строки таблицы Б)?",
        o: ["INNER JOIN", "FULL OUTER JOIN", "SELF JOIN", "CROSS JOIN"],
        a: 3,
        e: "CROSS JOIN без условий ON объединяет каждую строку первой таблицы с абсолютно каждой строкой второй."
      },
      {
        s: "Раздел 2. Выполнение SQL-запросов и JOIN",
        q: "11. В таблице 10 строк, во 2-й таблице 5 строк. Сколько строк вернет запрос с LEFT JOIN, если условие ON никогда не выполнилось (false)?",
        o: ["0 строк", "5 строк", "10 строк с NULL в полях правой таблицы", "50 строк"],
        a: 2,
        e: "LEFT JOIN сохраняет все 10 строк левой таблицы, заполняя значения правой таблицы значениями NULL."
      },
      {
        s: "Раздел 2. Выполнение SQL-запросов и JOIN",
        q: "12. Чем отличается операция UNION от UNION ALL?",
        o: ["UNION объединяет по колонкам, UNION ALL — по строкам", "UNION производит дедупликацию и сортировку, а UNION ALL оставляет дубликаты и работает быстрее", "UNION ALL быстрее только на SQLite", "UNION запрещен в стандарте ANSI SQL"],
        a: 1,
        e: "UNION требует скрытой группировки/сортировки для исключения дубликатов, UNION ALL просто конкатенирует наборы."
      },
      {
        s: "Раздел 2. Выполнение SQL-запросов и JOIN",
        q: "13. Каков результат выражения: NULL = NULL в стандартной трехуровневой логике SQL (3VL)?",
        o: ["TRUE", "FALSE", "UNKNOWN (NULL)", "Синтаксическая ошибка"],
        a: 2,
        e: "NULL — маркер неизвестности. Нельзя приравнять неизвестность к неизвестности, результат — UNKNOWN."
      },
      {
        s: "Раздел 2. Выполнение SQL-запросов и JOIN",
        q: "14. Что вернет запрос: SELECT COUNT(*), COUNT(col) FROM t, если в таблице 5 строк и в столбце col два значения равны NULL?",
        o: ["5 и 5", "5 и 3", "3 и 3", "5 и NULL"],
        a: 1,
        e: "COUNT(*) считает физические строки, а COUNT(поле) игнорирует строки со значением NULL."
      },

      /* РАЗДЕЛ 3: Оконные функции и подзапросы */
      {
        s: "Раздел 3. Оконные функции и подзапросы",
        q: "15. Зарплаты: 90 000, 90 000 и 70 000. Какие ранги присвоят RANK() и DENSE_RANK() сотруднику с зарплатой 70 000 (ORDER BY salary DESC)?",
        o: ["RANK = 2, DENSE_RANK = 2", "RANK = 3, DENSE_RANK = 2", "RANK = 2, DENSE_RANK = 3", "Обе функции вернут 3"],
        a: 1,
        e: "RANK делает пропуск при дублях: 1, 1, 3. DENSE_RANK идет без дыр: 1, 1, 2."
      },
      {
        s: "Раздел 3. Оконные функции и подзапросы",
        q: "16. Чем оконная функция принципиально отличается от группировки через GROUP BY?",
        o: ["Оконная функция не может вычислять агрегатные значения", "Оконная функция не сворачивает строки выборки в одну, а добавляет вычисленное значение к каждой строке", "Оконная функция выполняется до вычисления условий WHERE", "Оконные функции поддерживаются только в NoSQL СУБД"],
        a: 1,
        e: "GROUP BY сжимает строки по числу групп, а OVER() сохраняет каждую запись неизменной."
      },
      {
        s: "Раздел 3. Оконные функции и подзапросы",
        q: "17. Почему подзапрос с EXISTS часто работает быстрее, чем аналогичный подзапрос с IN, на больших объемах данных?",
        o: ["EXISTS останавливает сканирование при первом же совпадении (short-circuit), а IN собирает весь список значений", "EXISTS использует оперативную память, а IN пишет во временный файл", "EXISTS отключает валидацию транзакций", "IN не умеет работать с числовыми полями"],
        a: 0,
        e: "EXISTS работает по булеву принципу: найдено первое совпадение -> сразу возвращается TRUE."
      },
      {
        s: "Раздел 3. Оконные функции и подзапросы",
        q: "18. Какая оконная функция позволяет получить значение из ПРЕДЫДУЩЕЙ строки внутри партиции?",
        o: ["LEAD()", "LAG()", "FIRST_VALUE()", "NTH_VALUE()"],
        a: 1,
        e: "LAG(col, offset) смещается назад на offset строк, а LEAD(col, offset) — вперед."
      },
      {
        s: "Раздел 3. Оконные функции и подзапросы",
        q: "19. Что произойдет в запросе с конструкцией: WHERE col NOT IN (SELECT x FROM t), если подзапрос вернет хотя бы одно значение NULL?",
        o: ["Запрос проигнорирует NULL и отработает корректно", "Запрос вернет 0 строк (пустой результат) из-за логики 3VL", "Вызов упадет с критической ошибкой выполнения", "СУБД заменит NULL на 0"],
        a: 1,
        e: "col NOT IN (...) эквивалентно (col != v1 AND col != NULL). Сравнение с NULL дает UNKNOWN, а AND с UNKNOWN дает FALSE/UNKNOWN."
      },
      {
        s: "Раздел 3. Оконные функции и подзапросы",
        q: "20. Для чего служит предложение PARTITION BY внутри секции OVER()?",
        o: ["Для разбиения физической таблицы на разные диски", "Для деления результирующего набора на независимые окна расчетов без схлопывания строк", "Для явного назначения сортировки внутри окна", "Для удаления дубликатов из окна"],
        a: 1,
        e: "PARTITION BY определяет логические границы (группы), внутри которых локально рассчитывается оконная функция."
      },

      /* РАЗДЕЛ 4: Представления (VIEW) */
      {
        s: "Раздел 4. Представления (VIEW)",
        q: "21. Какое из представлений гарантированно является ОБНОВЛЯЕМЫМ (допускает прямой INSERT/UPDATE)?",
        o: ["Построенное на основе JOIN двух несвязанных таблиц", "Содержащее GROUP BY и HAVING", "Построенное по одной базовой таблице без DISTINCT, агрегатов и подзапросов", "Содержащее конструкцию UNION"],
        a: 2,
        e: "При наличии агрегатов, GROUP BY или JOIN СУБД теряет строгое сопоставление строки VIEW с физической строкой таблицы."
      },
      {
        s: "Раздел 4. Представления (VIEW)",
        q: "22. Для чего используется предложение WITH CHECK OPTION при создании представления?",

          const el = document.getElementById(`q-card-${index}`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            if (window.innerWidth < 600) {
              statsDrawer.classList.remove('open');
              toggleStatsBtn.textContent = 'Статистика';
            }
          }
        };
        matrixGrid.appendChild(mBtn);

        // Section header
        if (item.s !== lastSection) {
          lastSection = item.s;
          const sHeader = document.createElement('div');
          sHeader.className = 'section-header';
          sHeader.textContent = lastSection;
          root.appendChild(sHeader);
        }

        // Question card
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `q-card-${index}`;

        const qTitle = document.createElement('div');
        qTitle.className = 'card-title';
        qTitle.textContent = item.q;
        card.appendChild(qTitle);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';
        optionsDiv.id = `opts-${index}`;

        const expl = document.createElement('div');
        expl.className = 'expl-box';
        expl.id = `expl-${index}`;
        expl.innerHTML = `<strong>Разбор:</strong> ${item.e}`;

        item.o.forEach((optText, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.textContent = optText;

          btn.onclick = () => handleAnswer(index, optIdx);

          optionsDiv.appendChild(btn);
        });

        card.appendChild(optionsDiv);
        card.appendChild(expl);
        root.appendChild(card);
      });
    }

    function handleAnswer(qIndex, selectedIdx) {
      if (userAnswers[qIndex] !== null) return;

      const q = questions[qIndex];
      const isCorrect = (selectedIdx === q.a);
      userAnswers[qIndex] = { selected: selectedIdx, correct: isCorrect };

      answeredCount++;
      if (isCorrect) correctCount++; else wrongCount++;

      // UI changes
      const optsBox = document.getElementById(`opts-${qIndex}`);
      optsBox.classList.add('disabled');

      const btns = optsBox.children;
      if (isCorrect) {
        btns[selectedIdx].classList.add('correct');
      } else {
        btns[selectedIdx].classList.add('wrong');
        btns[q.a].classList.add('correct');
      }

      document.getElementById(`expl-${qIndex}`).classList.add('show');

      // Update Matrix
      const mItem = document.getElementById(`matrix-${qIndex}`);
      if (mItem) {
        mItem.classList.add(isCorrect ? 'is-correct' : 'is-wrong');
      }

      updateMetrics();
    }

    function updateMetrics() {
      hdrProgress.textContent = `${answeredCount}/50`;
      const pct = Math.round((answeredCount / 50) * 100);
      hdrPct.textContent = `${pct}%`;
      progressBar.style.width = `${pct}%`;

      statTotal.textContent = answeredCount;
      statCorrect.textContent = correctCount;
      statWrong.textContent = wrongCount;
    }

    function resetQuiz() {
      if (!confirm("Сбросить весь текущий прогресс и начать заново?")) return;
      userAnswers.fill(null);
      answeredCount = 0;
      correctCount = 0;
      wrongCount = 0;
      updateMetrics();
      init();
    }

    init();
  </script>
</body>
</html>
